name: Package Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.version.outputs.zip_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=rkv-site-guide.${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Stamp version into plugin files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\* Version: .*/\* Version: ${VERSION}/" rkv-site-guide.php
          sed -i "s/define( 'RKV_SITE_GUIDE_VERSION', '.*' );/define( 'RKV_SITE_GUIDE_VERSION', '${VERSION}' );/" rkv-site-guide.php

      - name: Install PHP dependencies
        run: composer install --no-dev --no-scripts --prefer-dist

      - name: Install and build JS assets
        run: npm ci && npm run build

      - name: Create plugin zip
        run: |
          npm run plugin-zip
          ZIP_CREATED=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP_CREATED" ]; then
            echo "::error::plugin-zip did not produce a zip file"
            exit 1
          fi
          mv "$ZIP_CREATED" "${{ steps.version.outputs.zip_name }}"

      - name: Attach zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.version.outputs.zip_name }}" --clobber

  push-to-reaktivist:
    needs: package
    runs-on: ubuntu-latest
    # Only run on full releases, not pre-releases
    if: ${{ !github.event.release.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: reaktivstudios/reaktivist
          token: ${{ secrets.REAKTIVIST_PAT }}

      - name: Download zip from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "rkv-site-guide.*.zip" \
            --repo ${{ github.repository }}

      - name: Commit zip to packages/plugins
        run: |
          cp "${{ needs.package.outputs.zip_name }}" packages/plugins/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "packages/plugins/${{ needs.package.outputs.zip_name }}"
          git commit -m "chore: add rkv-site-guide ${{ needs.package.outputs.version }} zip"
          git push
